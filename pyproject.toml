[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chessio"
version = "0.1.0"
description = "Assistant « meilleur coup » hors-ligne à partir d'une capture d'écran d'échiquier"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "numpy>=2",
    "pillow>=10",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
chessio = "chessio.__main__:main"

[project.gui-scripts]
chessio-gui = "chessio.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chessio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
