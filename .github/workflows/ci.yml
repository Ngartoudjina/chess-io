name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: engines
          key: stockfish-${{ hashFiles('scripts/fetch_stockfish.sh') }}

      - name: Stockfish
        run: bash scripts/fetch_stockfish.sh

      - name: Bibliothèques système (Qt hors écran, polices des captures synthétiques)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            moteur-rs/target
          key: rust-${{ hashFiles('moteur-rs/Cargo.lock', 'moteur-rs/src/**') }}

      - name: Moteur maison en Rust (lot L4)
        run: |
          cargo build --release --manifest-path moteur-rs/Cargo.toml
          cargo clippy --release --manifest-path moteur-rs/Cargo.toml -- -D warnings || true

      - name: Dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
