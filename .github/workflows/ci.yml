name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: engines
          key: stockfish-${{ hashFiles('scripts/fetch_stockfish.sh') }}

      - name: Stockfish
        run: bash scripts/fetch_stockfish.sh

      - name: Dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
